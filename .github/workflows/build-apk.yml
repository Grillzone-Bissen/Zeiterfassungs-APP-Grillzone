name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Code auschecken
      uses: actions/checkout@v4

    - name: 2. Java 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Python 3.11 einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 4. Buildozer & Cython installieren
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython<3.0.0" buildozer

    - name: 5. APK bauen
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
      run: |
        buildozer -v android debug

    - name: 6. Fertige APK als Artefakt hochladen
      uses: actions/upload-artifact@v4
      with:
        name: Zeiterfassung-Android-App
        path: bin/*.apk
