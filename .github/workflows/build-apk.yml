name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Code auschecken
      uses: actions/checkout@v4

    - name: 2. Java 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Python 3.11 einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

   - name: 4. Vollständige C/C++ & Autotools Build-Dependencies installieren
      run: |
        # Alle Ubuntu-Mirror auf den schnellen Hauptserver umstellen
        sudo sed -i -e 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' -e 's/security.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
        
        # Strikte Timeouts setzen (max. 10s pro Paket)
        sudo apt-get -o Acquire::http::Timeout="10" -o Acquire::Retries="3" update -q
        
        # Nur zwingend benötigte Pakete ohne Ballast installieren
        sudo apt-get -o Acquire::http::Timeout="10" -o Acquire::Retries="3" install -y --no-install-recommends --fix-missing \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixin-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          ccache \
          libffi-dev \
          libssl-dev \
          zip \
          unzip

    - name: 5. Buildozer & gepinnte Cython-Version installieren
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython<3.0.0" buildozer

    - name: 6. APK bauen
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
      run: |
        buildozer -v android debug

    - name: 7. Fertige APK als Artefakt hochladen
      uses: actions/upload-artifact@v4
      with:
        name: Zeiterfassung-Android-App
        path: bin/*.apk
