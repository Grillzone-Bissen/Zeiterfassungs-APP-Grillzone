name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Code auschecken
      uses: actions/checkout@v4

    - name: 2. Cache für Buildozer einrichten
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

    - name: 3. APK mit offiziellem Buildozer-Docker bauen
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/home/user/hostpython \
          kivy/buildozer android debug

    - name: 4. Fertige APK als Artefakt hochladen
      uses: actions/upload-artifact@v4
      with:
        name: Zeiterfassung-Android-App
        path: bin/*.apk
