<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeiterfassung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-container" class="card">
        <h2>Zeiterfassung Login</h2>
        <input type="number" id="login-nr" placeholder="Personalnummer (z. B. 99)" autofocus>
        <input type="password" id="login-pin" placeholder="PIN / Passwort">
        <button onclick="login()">Anmelden</button>
        <p id="login-msg" class="error-text"></p>
    </div>

    <!-- Hauptbereich der App (erst nach Login sichtbar) -->
    <div id="app-container" class="card" style="display: none;">
        <h2 id="welcome-user">Willkommen</h2>
        
        <div class="button-group">
            <button onclick="stamp('Arbeitsbeginn')" class="btn-start">Arbeitsbeginn</button>
            <button onclick="stamp('Arbeitsende')" class="btn-end">Arbeitsende</button>
        </div>

        <p id="status-msg"></p>

        <button onclick="openManualStampModal()" class="btn-secondary">Nachträglich stempeln</button>
        <button onclick="logout()" class="btn-logout">Abmelden</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
