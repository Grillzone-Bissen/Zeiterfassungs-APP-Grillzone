<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeiterfassung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- SEITE 1: LOGIN -->
        <div id="login-view" class="card">
            <h2>Zeiterfassung Login</h2>
            <input type="text" id="personal-nr-input" placeholder="Personalnummer eingeben">
            <button onclick="login()" class="btn btn-primary">Einloggen</button>
        </div>

        <!-- SEITE 2: ZEITERFASSUNG (Für normale Mitarbeiter) -->
        <div id="time-view" class="card hidden">
            <h2 id="welcome-msg"></h2>
            <p id="status-msg">Status: Bereit</p>
            
            <div class="button-group">
                <button onclick="stamp('Arbeitsbeginn')" class="btn btn-success">Arbeitsbeginn</button>
                <button onclick="stamp('Pause')" class="btn btn-warning">Pause</button>
                <button onclick="stamp('Arbeitsende')" class="btn btn-danger">Arbeitsende</button>
            </div>

            <!-- BUTTON ZUM ÖFFNEN DES MANUELLEN MODALS -->
            <div style="margin-top: 15px;">
                <button type="button" onclick="openManualStampModal()" class="btn btn-warning">
                    📝 Manuelle Zeiterfassung
                </button>
            </div>

            <hr>
            <button onclick="exportCSV()" class="btn btn-info">CSV Daten Exportieren</button>
            <button onclick="logout()" class="btn btn-outline">Abmelden</button>
        </div>

        <!-- SEITE 3: ADMIN-BEREICH (Nur für Nr. 99) -->
        <div id="admin-view" class="card hidden">
            <h2>Admin-Bereich</h2>
            <p>Willkommen, Administrator!</p>

            <!-- BUTTON AUCH IM ADMIN-BEREICH VERFÜGBAR -->
            <div style="margin-bottom: 15px;">
                <button type="button" onclick="openManualStampModal()" class="btn btn-warning">
                    📝 Manuelle Zeiterfassung nachbuchen
                </button>
            </div>
            
            <hr>
            <h3>Neuen User anlegen</h3>
            <input type="text" id="new-name" placeholder="Name des Mitarbeiters">
            <input type="text" id="new-nr" placeholder="Personalnummer">
            <button onclick="createUser()" class="btn btn-secondary">User Speichern</button>

            <hr>
            <h3>Vorhandene User löschen</h3>
            <div id="user-list"></div>

            <hr>
            <button onclick="exportCSV()" class="btn btn-info">Alle CSV-Daten Exportieren</button>
            <button onclick="logout()" class="btn btn-outline">Abmelden</button>
        </div>
    </div>

    <!-- MODAL (Direkt am Ende vor script, damit es sauber über der Seite gelagert werden kann) -->
    <div id="manual-stamp-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Manuelle Zeiterfassung nachbuchen</h3>
            
            <label for="manual-nr">Personalnummer:</label>
            <input type="number" id="manual-nr" placeholder="z. B. 1" required>

            <label for="manual-date">Datum:</label>
            <input type="date" id="manual-date" required>

            <label for="manual-action">Aktion:</label>
            <select id="manual-action">
                <option value="Arbeitsbeginn">Arbeitsbeginn</option>
                <option value="Pause Beginn">Pause Beginn</option>
                <option value="Pause Ende">Pause Ende</option>
                <option value="Arbeitsende">Arbeitsende</option>
            </select>

            <label for="manual-time">Uhrzeit (HH:MM):</label>
            <input type="time" id="manual-time" required>

            <div class="modal-actions" style="margin-top: 15px;">
                <button type="button" class="btn btn-success" onclick="submitManualStamp()">Speichern</button>
                <button type="button" class="btn btn-secondary" onclick="closeManualStampModal()">Abbrechen</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
