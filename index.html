<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeiterfassung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <!-- EBENE 1: LOGIN -->
        <div id="login-view" class="card">
            <h2>Zeiterfassung Login</h2>
            <form id="login-form" onsubmit="handleLoginSubmit(event)">
                <input type="text" id="personal-nr-input" placeholder="Personalnummer eingeben" autofocus autocomplete="off">
                <button type="submit" class="btn btn-primary">Einloggen</button>
            </form>
            <p id="login-error-msg" style="color: red; margin-top: 10px;"></p>
        </div>

        <!-- EBENE 2A: MITARBEITER-ZEITERFASSUNG -->
        <div id="time-view" class="card hidden">
            <h2 id="welcome-msg">Willkommen!</h2>
            <p id="status-msg">Status: Bereit</p>
            
            <div class="button-group">
                <button type="button" onclick="stamp('Arbeitsbeginn')" class="btn btn-success">Arbeitsbeginn</button>
                <button type="button" onclick="stamp('Pause')" class="btn btn-warning">Pause</button>
                <button type="button" onclick="stamp('Arbeitsende')" class="btn btn-danger">Arbeitsende</button>
            </div>

            <hr>
            <button type="button" onclick="logout()" class="btn btn-outline">Abmelden</button>
        </div>

        <!-- EBENE 2B: ADMIN-BEREICH (Nur mit Nr. 99) -->
        <div id="admin-view" class="card hidden">
            <h2>Admin-Bereich</h2>
            <p id="admin-welcome-msg">Angemeldet als Administrator (99)</p>
            
            <hr>
            <h3>Neuen User anlegen</h3>
            <input type="text" id="new-name" placeholder="Name">
            <input type="text" id="new-nr" placeholder="Personalnummer">
            <button type="button" onclick="createUser()" class="btn btn-secondary">User Speichern</button>

            <hr>
            <h3>Manuelle Zeiterfassung</h3>
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <input type="text" id="manual-user-nr" placeholder="Personalnummer eingeben" style="margin: 0;">
                <button type="button" onclick="openManualTimeForm()" class="btn btn-primary" style="width: auto; margin: 0; white-space: nowrap;">Mitarbeiter wählen</button>
            </div>

            <!-- Formular klappt nach Auswahl des Users auf -->
           <div id="manual-time-form" class="hidden" style="display: none; background: #f9f9f9; padding: 12px; border-radius: 6px; border: 1px solid #ddd; margin-top: 10px;">
            <h4 id="manual-selected-user-header" style="margin-top: 0; margin-bottom: 10px;"></h4>
    
            <label style="font-size: 12px; font-weight: bold; display: block; margin-top: 5px;">Datum:</label>
            <input type="date" id="manual-date" style="margin-bottom: 8px; width: 100%;">

            <label style="font-size: 12px; font-weight: bold; display: block; margin-top: 5px;">Arbeitsbeginn (HH:MM):</label>
            <input type="time" id="manual-start-time" style="margin-bottom: 8px; width: 100%;">

            <label style="font-size: 12px; font-weight: bold; display: block; margin-top: 5px;">Arbeitsende (HH:MM):</label>
            <input type="time" id="manual-end-time" style="margin-bottom: 12px; width: 100%;">

            <button type="button" onclick="submitManualTime()" class="btn btn-success">Zeiten Speichern</button>
            </div>

            <hr>
            <h3>Mitarbeiterliste</h3>
            <ul id="user-list-container" style="list-style: none; padding: 0;"></ul>

            <hr>
            <button type="button" onclick="exportCSV()" class="btn btn-info">CSV Daten Exportieren</button>
            <button type="button" onclick="logout()" class="btn btn-outline">Abmelden</button>
        </div>

    </div>
    <script src="app.js?v=4"></script>
</body>
</html>
